# XTDrone / Gazebo spawn poses — single source of truth for simulation.
# These values MUST match multi_vehicle_with_ground.launch in the xtdrone-ad
# container (/root/PX4_Firmware/launch/multi_vehicle_with_ground.launch).
#
# Planning launch files read spawn_x / spawn_y from here via multi_robot_xtdrone.launch.

ground:
  ground_0:
    x: 0.0
    y: 0.0
    z: 0.15

drones:
  drone_0:
    drone_num: 0
    x: -2.0
    y: 0.0
    z: 0.0
  drone_1:
    drone_num: 1
    x: 2.0
    y: 0.0
    z: 0.0
  drone_2:
    drone_num: 2
    x: 0.0
    y: 2.0
    z: 0.0
