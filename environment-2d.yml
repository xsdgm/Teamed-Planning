name: teamedplanning-2d
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - -r src/teamed-planning/scripts/requirements.txt
      - -r src/teamed-planning/scripts/simulator/requirements.txt
      - torch==2.14.1+cpu
